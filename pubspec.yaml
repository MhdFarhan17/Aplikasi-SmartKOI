name: smartkoi
description: "Aplikasi Monitoring Aquarium Ikan KOI berbasis IoT dengan Flutter dan Firebase."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.0
  firebase_database: ^10.5.6
  get: ^4.6.6
  intl: ^0.19.0
  fl_chart: ^0.68.0
  iconsax: ^0.0.8
  get_storage: ^2.1.1
  google_nav_bar: ^5.0.6
  google_fonts: ^6.2.1
  cloud_firestore: ^4.17.3
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2
  firebase_performance: ^0.9.4+7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/icon-app.png"

flutter_native_splash:
  color: "#117bb7"
  image: "assets/images/splash-logo.png"

  android_12:
    color: "#117bb7"
    image: "assets/images/splash-logo.png"